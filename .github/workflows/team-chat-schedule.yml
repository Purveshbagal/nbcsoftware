name: Scheduled team chat messages

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
jobs:
  send-scheduled-message:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Trigger scheduled team chat message
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "GitHub Actions OIDC is unavailable; check the id-token: write permission."
            exit 1
          fi
          if [ "$SCHEDULE" = "30 3 * * *" ]; then
            JOB=morning
          else
            JOB=night
          fi
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwork.nbcpedia.com%2Fsfa-chat-scheduler")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -er '.value')"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://work.nbcpedia.com/api/sfa/chat/birthday-check?job=$JOB"
