name: Scheduled team chat messages

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"
jobs:
  send-scheduled-message:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled team chat message
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Configure the CRON_SECRET repository secret."
            exit 1
          fi
          if [ "$SCHEDULE" = "30 3 * * *" ]; then
            JOB=morning
          else
            JOB=night
          fi
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://work.nbcpedia.com/api/sfa/chat/birthday-check?job=$JOB"
